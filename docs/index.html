<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#f5f8fc;background:#0c1525;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:0 0 env(safe-area-inset-bottom);background:#0c1525}button,input{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:16px 13px 50px}.banner{display:block;width:100%;height:auto;border-radius:13px;margin:0 0 12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.eyebrow{font-size:10px;color:#9ab1c9;letter-spacing:2px;font-weight:800}.title{font-size:clamp(21px,5.5vw,29px);font-weight:900;margin-top:4px}.brand{display:inline-grid;place-items:center;background:#e9f039;color:#111;border-radius:10px;width:37px;height:37px;margin-right:7px}.tool,.refresh,.chip,.arrow{border:1px solid #34445c;background:#1b2b42;color:#eaf2fc;border-radius:11px;padding:9px 11px;font-size:12px;font-weight:750}.refresh{font-size:21px}.refresh:disabled{opacity:.5}
.calendar{background:#1c2a40;border:1px solid #31445c;border-radius:17px;padding:12px;margin-bottom:12px}.datehead{display:flex;align-items:center;justify-content:space-between}.arrow{border:0;background:transparent;font-size:27px}.day{text-align:center;font-size:18px;font-weight:850}.daymeta{font-size:10px;letter-spacing:1.5px;color:#a2bfdc;text-align:center;margin-bottom:3px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}.weekday{border:1px solid transparent;background:transparent;color:#b8c9da;border-radius:10px;padding:6px 0;min-width:0}.wd{display:block;font-size:10px}.num{display:block;font-size:17px;font-weight:800;margin-top:4px}.weekday.selected{background:#e9f039;color:#101923}.dot{display:block;margin:4px auto 0;background:#90a7c0;border-radius:50%;width:4px;height:4px;opacity:0}.weekday.has-games .dot{opacity:1}.weekday.selected .dot{background:#101923}
.toolbar,.actions,.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}.actions .tool{flex:1;white-space:nowrap}.datepick{position:relative;overflow:hidden}.datepick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.count{margin-left:auto;color:#a2b5cb;font-size:12px}.chip{border-radius:99px;color:#b6c9df;padding:8px 12px}.chip.active{background:#e9f039;color:#141c22;border-color:#e9f039}.notice{font-size:12px;color:#e1c785;margin:7px 0 12px}.hide{display:none!important}
.featured{border:1px solid #40536c;background:#1b2b42;border-radius:12px;padding:10px 12px;margin:0 0 14px;display:flex;align-items:center;gap:8px;width:100%;color:#f6f9ff;text-align:left}.featured .star{color:#e9f039}.featured .match{flex:1;min-width:0;font-size:12px;font-weight:800}.featured .best{font-size:10px;color:#c1d2e4}.featured .bestgs{background:#e9f039;color:#141c22;border-radius:7px;padding:5px 7px;font-weight:900;font-size:12px}
.games{display:grid;gap:11px}.game{border-radius:15px;overflow:hidden;box-shadow:0 4px 14px #0003;color:#111723;scroll-margin-top:10px}.gamehead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px 0}.time{font-size:12px;font-weight:850}.headright{display:flex;align-items:center;gap:7px}.scorebadge{background:#122238;color:white;font-size:22px;font-weight:900;border-radius:11px;padding:6px 10px;min-width:58px;text-align:center;line-height:1}.scorebadge small{display:block;font-size:9px;letter-spacing:1px;color:#b8c9dd;margin-bottom:4px}.teams{padding:6px 12px 10px}.team{display:flex;align-items:center;gap:10px;padding:5px 2px;min-height:57px}.logo{width:51px;height:51px;object-fit:contain;flex:none}.name{flex:1;font-size:16px;font-weight:800;line-height:1.2;min-width:0}.name.magic{background:#0b0bff;color:#fff;border-radius:5px;padding:6px}.at{font-size:10px;color:#354253;font-weight:800;margin-left:61px}.status{margin:0 12px 11px;padding:8px 10px;background:#13233c;color:#f3f7fd;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px;font-size:12px;font-weight:800}.status.hidden{display:none}.status .label{font-size:11px;letter-spacing:.4px}.status .points{font-size:14px;font-variant-numeric:tabular-nums}.status.close{background:#135445}.status.blowout{background:#7c4519}.status.final{background:#344053}.status.closefinal{background:#145b51}.status.pre{background:#20354f}.broadcast{margin:0 12px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.network{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:4px 7px;background:#14243a;color:#fff;font-size:10px;font-weight:900}.network.espn{background:#c51d30}.network.peacock{background:#20202b}.network.prime{background:#176aab}.network.lp{background:#123f7d}.network img{height:15px;max-width:48px;object-fit:contain}.leaders{display:flex;gap:9px;justify-content:center;margin:2px 12px 12px}.leader{display:flex;align-items:center;gap:5px;max-width:48%;background:#15263c;color:#fff;border-radius:20px;padding:3px 9px 3px 3px;font-size:10px;font-weight:750}.leader img{width:34px;height:30px;object-fit:cover;border-radius:50%;background:#dae0e9}.leader span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty,.error{border:1px solid #31445c;border-radius:16px;background:#19283d;padding:26px 18px;text-align:center;color:#b6c8db;line-height:1.6}.error{color:#ffb5b5}.footer{color:#879db7;font-size:11px;text-align:center;margin-top:18px;line-height:1.6}
@media(min-width:500px){.app{padding:24px}.name{font-size:18px}.logo{width:57px;height:57px}}@media(max-width:365px){.name{font-size:14px}.logo{width:44px;height:44px}.weekday .num{font-size:15px}.weekday .wd{font-size:9px}}

/* V3.3 compact two-column matchups */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 8px;align-items:center}
.team{position:relative;display:flex;justify-content:center;align-items:center;min-height:116px;padding:2px;overflow:visible}
.logo{width:min(100%,126px);height:110px;object-fit:contain;flex:none}
.name,.at,.leaders{display:none!important}
.player-headshot{position:absolute;bottom:0;right:calc(50% - 68px);width:62px;height:62px;object-fit:cover;object-position:center top;border:3px solid #15263c;border-radius:50%;background:#e7edf3;box-shadow:0 2px 5px #0005}
.preview-panel{background:#182a42;border:1px solid #6b83a2;border-radius:14px;padding:12px;margin:0 0 12px;color:#f4f8fc}
.preview-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.preview-panel select,.preview-panel button{background:#0d1b30;color:#fff;border:1px solid #60718a;border-radius:8px;padding:8px;max-width:100%}
.preview-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;align-items:center}
.preview-panel .preview-note{font-size:11px;color:#c4d7ee;line-height:1.5;margin-top:8px}
.preview-active{outline:2px solid #e9f039}
.preview-tag{font-size:11px;color:#e9f039;font-weight:850;letter-spacing:.5px}
@media(max-width:380px){.team{min-height:96px}.logo{height:92px}.player-headshot{width:52px;height:52px;right:calc(50% - 59px)}}

/* Consolidated layout: logo / two stacked portraits / logo / scores */
.game{position:relative}.gamehead{padding:9px 12px 0;min-height:27px}.gamehead .scorebadge{display:none}
.match-grid{display:grid;grid-template-columns:minmax(0,1fr) 65px minmax(0,1fr) 64px;align-items:center;gap:3px;padding:3px 9px 11px;min-height:106px}
.match-grid .team{min-height:88px;overflow:hidden;padding:0}.match-grid .logo{width:100%;height:90px;max-width:125px}
.portrait-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.portrait-stack img{width:53px;height:45px;object-fit:contain;object-position:center bottom;display:block}
.portrait-stack .missing-face{width:53px;height:45px}
.score-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.score-side .scorebadge{display:block;font-size:20px;padding:6px 7px;min-width:52px}
.score-side .live-points{font-size:15px;line-height:1.15;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-side .mini-status{font-size:9px;line-height:1.1;text-align:center;font-weight:900;overflow-wrap:anywhere;color:#16243b}
.broadcast{margin:0;position:absolute;top:8px;left:50%;transform:translateX(-50%);justify-content:center;min-height:16px}
.network{font-size:10px;padding:3px 7px}.status{display:none!important}
.preview-panel{margin-top:22px;border-color:#304159;background:#101e31;padding:9px;font-size:11px}
.preview-panel .preview-note{font-size:10px}
@media(max-width:380px){.match-grid{grid-template-columns:minmax(0,1fr) 51px minmax(0,1fr) 57px;padding:4px 7px 10px}.portrait-stack img{width:45px;height:41px}.match-grid .logo{height:79px}.score-side .scorebadge{font-size:18px;min-width:49px}}

/* V4.1: larger player portraits, full-card Magic highlight, pregame countdown */
.match-grid{grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr) 64px;min-height:137px;gap:3px}
.match-grid .team{min-height:112px}
.match-grid .logo{height:109px}
.portrait-stack{gap:2px}
.portrait-stack img,.portrait-stack .missing-face{width:74px;height:62px}
.game.magic-game{background:#174dca!important;color:#fff!important;border:2px solid #6cafff}

function applyScore(card,g){var s=scoreFor(g),info=s?classify(s):null;
 var side=card.querySelector('.score-side'),status=side.querySelector('.mini-status'),points=side.querySelector('.live-points');
 status.textContent='';status.classList.remove('countdown');points.textContent='';card.querySelectorAll('.team-points').forEach(function(x){x.textContent=''});var alert=side.querySelector('.game-alert');alert.textContent='';alert.hidden=true;
 if(info&&info.type!=='pre'){
       // Derive the two independent lines from the game state, never from a combined label.
    // In particular CLOSE FINAL must produce CLOSE + FINAL, not CLOSE + CLOSE + FINAL.
    var alertText=(info.type==='close'||info.type==='closefinal')?'CLOSE':info.type==='blowout'?'BLOWOUT':'';
    alert.textContent=alertText;alert.hidden=!alertText;
    var detail=(info.type==='final'||info.type==='closefinal')?'FINAL':String(info.label||'').replace(/^(?:CLOSE|BLOWOUT|LIVE)(?:\s*[·—-]\s*|\s+|$)/i,'').trim();
    detail=detail.replace(/^(?:CLOSE|BLOWOUT)\s+/i,'');
    // Some feed labels repeat the quarter (e.g. Q2 Q2 6:53).
    detail=detail.replace(/^(Q\d+|OT\d*)\s+\1(?=\s|$)/i,'$1');
    // Show the BALLDONTLIE game clock when available, without guessing between updates.
    if(s&&String(s.state||'').toLowerCase()==='in'&&String(s.clock||'').trim()){
      var quarter=Number(s.period||0);
      var quarterLabel=quarter>4?'OT'+(quarter>5?quarter-4:''):quarter>0?'Q'+quarter:'';
      var clock=String(s.clock).trim();
      // Some BALLDONTLIE time values already include the quarter (e.g. 'Q2 1:31').
      // Remove that prefix so the quarter is displayed only once.
      clock=clock.replace(/^(?:Q\d+|OT\d*)\s+/i,'').trim();
      if(quarterLabel){detail=quarterLabel+(clock?' '+clock:'');}
    }
    var match=detail.match(/^(Q\d+|OT\d*|FINAL(?:\/OT)?)(?:\s+(.+))?$/i);
    if(match){status.appendChild(el('span','status-line',match[1].toUpperCase()));if(match[2])status.appendChild(el('span','status-line',match[2]));}
    else status.textContent=detail;
if(!hideScores&&info.score){
   var nums=String(info.score).split(/\s*[–—-]\s*/);
   var teamPoints=card.querySelectorAll('.team-points');
   if(nums.length===2&&teamPoints.length===2){teamPoints[0].textContent=nums[0].trim();teamPoints[1].textContent=nums[1].trim()}
 }
 }else{var count=timeUntil(g);if(count){status.textContent=count;status.classList.add('countdown')}}
 var value=String(g.broadcaster||'').trim();
 if(/espn|abc/i.test(value))value='ESPN';else if(/peacock|nbc/i.test(value))value='Peacock';else if(/prime|amazon/i.test(value))value='Prime Video';else value='';
 var slot=card.querySelector('.service-slot');slot.replaceChildren();slot.appendChild(broadcasterLogo(value||'NBA League Pass'));
}

  guideJsonp(function(data){
    $('refresh').disabled=false;
    if(!data||!Array.isArray(data.games)){showError('Invalid schedule response.');return;}
    allGames=data.games;leaders=data.players||{};loaded=true;lastSync=Date.now();$('footer').textContent='';render();requestScores(selected,false);
  },function(message){$('refresh').disabled=false;showError('Could not read Google Sheet: '+message);});

function requestScores(key,force){
  if(preview||!loaded||filter==='must')return;
  if(!force&&scoreCache[key]&&Date.now()-(scoreRequests[key]||0)<60000)return;
  scoreRequests[key]=Date.now();var token=++requestToken;
  fetch('scores/'+encodeURIComponent(key)+'.json?ts='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error(r.status===404?'Scores not archived for this date':'HTTP '+r.status);return r.json()})
  .then(function(data){if(!data||!data.available||!Array.isArray(data.games))throw new Error(data&&data.error||'Score data unavailable');
    scoreCache[key]=data.games;delete scoreErrors[key];lastScoreSync=Date.now();
    if(key===selected&&token===requestToken)updateStatuses();})
  .catch(function(e){scoreErrors[key]=String(e.message||e);delete scoreCache[key];if(key===selected&&token===requestToken)updateStatuses()});
}

/* V4.16: Independent calendar dialog; no iOS native date-picker dependency. */
(function(){
var dialog=document.getElementById('dateDialog'),grid=document.getElementById('monthGrid');
var monthYear=2026,monthIndex=9;
function close(){dialog.classList.add('hide')}
function draw(){
 var first=new Date(Date.UTC(monthYear,monthIndex,1));
 document.getElementById('monthTitle').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
 grid.replaceChildren();
 ['S','M','T','W','T','F','S'].forEach(function(n){var el=document.createElement('span');el.className='dow';el.textContent=n;grid.appendChild(el)});
 for(var i=0;i<first.getUTCDay();i++){grid.appendChild(document.createElement('span'))}
 var days=new Date(Date.UTC(monthYear,monthIndex+1,0)).getUTCDate();
 for(var d=1;d<=days;d++){
  var key=monthYear+'-'+String(monthIndex+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  var b=document.createElement('button');b.type='button';b.textContent=d;b.setAttribute('aria-label',key);
  if(key===selected)b.className='current';
  b.addEventListener('click',(function(k){return function(){close();setFilter('all');setDay(k)}})(key));grid.appendChild(b);
 }
}
document.getElementById('chooseDate').addEventListener('click',function(){var p=selected.split('-');monthYear=Number(p[0]);monthIndex=Number(p[1])-1;draw();dialog.classList.remove('hide')});
function move(n){var dt=new Date(Date.UTC(monthYear,monthIndex+n,1));monthYear=dt.getUTCFullYear();monthIndex=dt.getUTCMonth();draw()}
document.getElementById('monthPrev').addEventListener('click',function(){move(-1)});
document.getElementById('monthNext').addEventListener('click',function(){move(1)});
document.getElementById('dateClose').addEventListener('click',close);
document.getElementById('dateToday').addEventListener('click',function(){close();setFilter('all');setDay(todayKey())});
dialog.addEventListener('click',function(e){if(e.target===dialog)close()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
})();

load();
</script>
